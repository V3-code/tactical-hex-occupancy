name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Prepare versioned release
        run: node tools/build-release.mjs "$GITHUB_REF_NAME"
      - name: Package module
        working-directory: dist/package
        run: zip -r ../tactical-hex-occupancy.zip .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/tactical-hex-occupancy.zip
          dist/module.json
          --title "Tactical Hex Occupancy $GITHUB_REF_NAME"
          --notes "Standalone tactical hex occupancy module extracted from the native feature of GURPS GUM. See the README for installation, attribution, and compatibility details."
      - name: Register release with Foundry VTT
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: node tools/publish-foundry-release.mjs "$GITHUB_REF_NAME"
