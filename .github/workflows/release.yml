name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Package module
        run: >-
          zip -r tactical-hex-occupancy.zip
          module.json README.md LICENSE.md
          assets lang module scripts styles
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          tactical-hex-occupancy.zip
          --title "Tactical Hex Occupancy $GITHUB_REF_NAME"
          --notes "Standalone tactical hex occupancy module extracted from the native feature of GURPS GUM. See the README for installation, attribution, and compatibility details."
